# Code obfuscation on obtune's Python corpus — the known-positive control.
# obtune's data is read-only here; H1 is absent by construction (not in the CFT pools, not in
# TRAINABLE_CONDITIONS) and this project never reads data/quarantine/.

conditions: [L1b, L1r, L2, S1, S2]   # S1/S2 structural (well-posed inverse), L* renaming (not)
n_train: 6500
n_val: 500
n_test: 500              # programs; x5 conditions = 2,500 pairs (power analysis, 2026-09-10)
seed: 17
n_shots: 2

exec_timeout_s: 2.0
# exec_workers is deliberately ABSENT. It is derived from len(os.sched_getaffinity(0)) --
# the CPUs SLURM actually granted this job -- because a hardcoded count oversubscribes the
# allocation and obtune's executor then kills children on wall clock and reports the timeout
# as status="error", which the criterion reads as a WRONG ANSWER. Measured 2026-09-12 on a node
# with 8 of 64 CPUs allocated: 32 workers scored 40 known-correct answers at 0.375; 4 workers
# scored the same 40 at 1.000. See bidir.domains._common.exec_workers.
reverse_sim_threshold: 0.4          # obtune's published-criterion thresholds, carried over
reverse_readability_tolerance: 0.1

sampling: {temperature: 0.0, top_p: 1.0, max_tokens: 1536, seed: 17}
engine: {max_model_len: 4096, max_loras: 8, gpu_memory_utilization: 0.85, seed: 17}
