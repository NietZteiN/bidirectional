# Expansion <-> factorization (catalogue #56). The paper's formal-reasoning domain.
# Chosen over #55 (differentiation <-> integration) because integration entangles "the model
# failed" with "no elementary antiderivative exists"; every instance here has an answer.

n_train: 6500
n_val: 500
n_test: 2500
seed: 17
n_shots: 2

# Weighted toward degree 3-4: the distinct-primitive-quadratic space is finite
# (~2,145 in one variable) and a corpus of 7,500 cannot be drawn mostly from it.
degrees: [2, 3, 3, 4, 4]
max_root: 15               # roots in [-15, 15]; widened so 7,500 distinct polynomials exist

sampling: {temperature: 0.0, top_p: 1.0, max_tokens: 256, seed: 17}
engine: {max_model_len: 4096, max_loras: 8, gpu_memory_utilization: 0.85, seed: 17}

# Eval size set 2026-09-10 from the power analysis (scripts/17_power.py, results/power/).
# At n=500 the three headline detections are certain (power 1.00) but every EQUIVALENCE claim --
# "replacing is as good as doubling", "the dose is free on general ability", "the ladder has
# saturated" -- carries an interval of +/-4.1 pp, which cannot support a claim of no difference.
# The interval reaches the +/-2.0 pp margin at n ~ 2,500.
