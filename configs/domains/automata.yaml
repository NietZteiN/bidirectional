# Game of Life (catalogue #30): a DETERMINED but computationally hard inverse.
#
# This is the axis `fmt_det*` cannot reach. There, the inverse is undetermined and no reverse
# dose can help. Here every instance has a predecessor by construction, so the inverse is fully
# determined and only the SEARCH is hard (NP-hard in general). Together the two cells let RQ3
# say which kind of hardness a reverse dose buys its way out of, instead of running the two
# kinds of "invertibility" together.

height: 6
width: 6
density: 0.35          # live-cell probability when drawing a predecessor

n_train: 6500
n_val: 500
n_test: 2500
seed: 17
n_shots: 2

sampling: {temperature: 0.0, top_p: 1.0, max_tokens: 256, seed: 17}
engine: {max_model_len: 4096, max_loras: 8, gpu_memory_utilization: 0.85, seed: 17}

# Eval size set 2026-09-10 from the power analysis (scripts/17_power.py, results/power/).
# At n=500 the three headline detections are certain (power 1.00) but every EQUIVALENCE claim --
# "replacing is as good as doubling", "the dose is free on general ability", "the ladder has
# saturated" -- carries an interval of +/-4.1 pp, which cannot support a claim of no difference.
# The interval reaches the +/-2.0 pp margin at n ~ 2,500.
