# Data-to-text on WebNLG 2020 v3.0 (English). Loaded from the parquet branch: the dataset
# ships as a loading script, which datasets>=4 refuses to execute.

hf_id: webnlg-challenge/web_nlg
config: release_v3.0_en

n_train: 6500
n_val: 500
n_test: 2500
seed: 17
n_shots: 2

# Granite-3.1-8B: US-origin, Apache 2.0, on disk, and in no cell of the grid. Same choice as
# the SQL round-trip parser and for the same reason — an extractor sharing a lineage with the
# model under test would read its own phrasing favourably.
roundtrip_extractor: ibm-granite/granite-3.1-8b-instruct
roundtrip_max_tokens: 256

sampling: {temperature: 0.0, top_p: 1.0, max_tokens: 512, seed: 17}
# THIS DOMAIN NEEDS TWO MODELS RESIDENT AT ONCE. The forward criterion round-trips through a frozen
# triple extractor (granite-3.1-8b), so the card carries the model under test AND the extractor.
# vLLM's gpu_memory_utilization is a share of TOTAL device memory reserved outright per engine
# -- two engines do not negotiate -- so the budget is split explicitly here instead of both
# defaulting to 0.85 and asking for 1.70 of the card. On an H200 (141 GB) this is 63 GB each:
# ample for a 3B under test and an 8B extractor. `bidir.engine.get_engine` asserts the sum < 0.95.
engine: {max_model_len: 4096, max_loras: 8, gpu_memory_utilization: 0.45, seed: 17}
roundtrip_gpu_memory_utilization: 0.45

# Eval size set 2026-09-10 from the power analysis (scripts/17_power.py, results/power/).
# At n=500 the three headline detections are certain (power 1.00) but every EQUIVALENCE claim --
# "replacing is as good as doubling", "the dose is free on general ability", "the ladder has
# saturated" -- carries an interval of +/-4.1 pp, which cannot support a claim of no difference.
# The interval reaches the +/-2.0 pp margin at n ~ 2,500.
