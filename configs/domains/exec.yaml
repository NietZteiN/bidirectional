# Execution prediction on CRUXEval — output prediction <-> input prediction.
# CRUXEval is 800 problems in one split, so train/val/test are carved from it by PROGRAM with
# a fixed seed. This cell is deliberately smaller than the 6,500 every other domain gets; it
# is counted as the small cell it is rather than resampled up to look uniform.
#
# AND IT IS SMALLER STILL, BECAUSE THE CORPUS IS NOW VERIFIED BY EXECUTION (Amendment 15).
# 800 problems in, 602 kept, audited at build time and reported in the build log:
#   -  56  output equals input as a string  -> "copy your input" would be the correct answer
#   - 125  f(output) == output              -> echoing the output is a VALID PREIMAGE, so echo
#                                              is a correct REVERSE answer on those instances
#   -  16  will not execute at all          -> a criterion that runs the program cannot score it
#   -   0  f(input) != output               -> the corpus is execution-consistent; good news
# The 125 are the important ones. Before this, pure echo scored 0.200 on exec reverse, which
# breaks the rule the project rests on (echo never counts as success, CLAUDE.md §3.4) and echo
# is precisely what rises under forward-only training -- so a model degenerating to copying
# would have looked like retained reverse ability. After the audit the oracle test is clean in
# both directions: GOLD 1.000, ECHO 0.000, EMPTY 0.000.

hf_id: cruxeval-org/cruxeval
hf_split: test

n_train: 0        # 0 = whatever remains after test and val (302 after the execution audit)
n_val: 100
# 200, not 400. Raising it to 400 for the power analysis took the increase straight out of
# TRAIN -- CRUXEval is 800 problems in total -- leaving 299 training pairs against 6,500 in every
# other cell, where the dose ladder's low rungs would reverse three pairs. This cell's job is
# RQ1, does collapse happen at all, which is a 20-30 pp effect that n=200 detects with certainty.
# It was never going to carry an equivalence claim: those need ~2,500 and this corpus holds 800.
n_test: 200
seed: 17
n_shots: 2

exec_timeout_s: 2.0
# exec_workers is deliberately ABSENT. It is derived from len(os.sched_getaffinity(0)) --
# the CPUs SLURM actually granted this job -- because a hardcoded count oversubscribes the
# allocation and obtune's executor then kills children on wall clock and reports the timeout
# as status="error", which the criterion reads as a WRONG ANSWER. Measured 2026-09-12 on a node
# with 8 of 64 CPUs allocated: 32 workers scored 40 known-correct answers at 0.375; 4 workers
# scored the same 40 at 1.000. See bidir.domains._common.exec_workers.

sampling: {temperature: 0.0, top_p: 1.0, max_tokens: 256, seed: 17}
engine: {max_model_len: 4096, max_loras: 8, gpu_memory_utilization: 0.85, seed: 17}
